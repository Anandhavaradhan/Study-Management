# Publishes the planner to GitHub Pages: https://anandhavaradhan.github.io/Study-Management/
# The site is served from the gh-pages branch; this copies the site's files there on every change to main.
name: Website

on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'icons/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site's files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons _site/
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
          commit_message: Publish the site
